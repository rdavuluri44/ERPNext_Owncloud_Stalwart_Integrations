name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install 'PyJWT[crypto]>=2.8,<3' 'requests>=2.32,<3' 'PyYAML==6.0.3'
      - name: Client identity stays private (P84)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            python tools/check_client_identity.py --text "$PR_TITLE" --text "$PR_BODY" --commits "origin/$BASE_REF..HEAD"
          else
            python tools/check_client_identity.py
          fi
      - run: python tools/check_repository.py
      - run: python tools/run_unit_tests.py
      - run: python test_recovery_guard.py
        working-directory: integrations/authentik/invite-recovery
      - run: node --test integrations/authentik/invite-recovery/test_invitations.mjs
      - run: find erpnext_drive_integrations/public integrations -name '*.js' -print0 | xargs -0 -n1 node --check

  # The native Android app's own checks (P50; P100: the mobile app is checked in CI): logic tests, Android lint with
  # warnings as errors, the screen tests with the link robot and a debug build, with every library's checksum checked.
  native-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17 (installed on the runner)
        run: echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Gradle 9.9.2, checksum checked (9.9.2 fixes the Gradle advisories published up to 19 November 2026)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gradle.zip" https://services.gradle.org/distributions/gradle-9.9.2-bin.zip
          echo "971fcd7150ca4ba04852c0b2ca0d2d0ab9468e14b03473eab19528809914c76b  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.9.2/bin" >> "$GITHUB_PATH"
      - name: gradle checkAll
        working-directory: mobile-native
        run: gradle checkAll --no-daemon --stacktrace
